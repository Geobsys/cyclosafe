# Cyclosafe : synchronisation de l'heure système via GPS (gpsd + PPS)
# Installé dans /etc/chrony/conf.d/ par setup/systemd/setup_services.sh
#
# NMEA : heure transmise par gpsd en mémoire partagée (SHM 0). Donne la seconde
#        exacte mais avec un retard de transmission série (dépend du baudrate).
#        noselect : seulement utilisée pour verrouiller le PPS.
# PPS  : impulsion du GPS sur GPIO18 (/dev/pps0, overlay pps-gpio). Donne le début
#        exact de chaque seconde, la seconde elle-même étant fournie par NMEA (lock).
#
# Calibration de l'offset NMEA : une fois le PPS synchronisé (chronyc sources),
# relever la valeur moyenne de "Offset" de NMEA dans `chronyc sourcestats` et
# la reporter ci-dessous. Le retard NMEA doit rester < 0.5 s pour que le PPS soit
# associé à la bonne seconde.
refclock SHM 0 refid NMEA offset 0.0 delay 0.2 noselect
refclock PPS /dev/pps0 refid PPS lock NMEA prefer
